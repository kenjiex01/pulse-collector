; Pulse — reference PHP upload limits for local dev PHP (conf.d).
; Source of truth: config/uploads.php (also used by NativeAppServiceProvider for desktop builds).
; Copy to your PHP conf.d (e.g. Homebrew: /opt/homebrew/etc/php/8.5/conf.d/99-pulse-uploads.ini)
upload_max_filesize = 15M
post_max_size = 20M
